<div class="card">
  <h2>Registrar Usuario</h2>
  <form #userForm="ngForm" (ngSubmit)="guardarUsuario(userForm)">
    
    <label>Nombre:</label>
    <input type="text" name="nombre" [(ngModel)]="usuario.nombre">

    <label>Apellido Paterno:</label>
    <input type="text" name="paterno" [(ngModel)]="usuario.paterno">
    <label>Apellido Materno:</label>
    <input type="text" name="materno" [(ngModel)]="usuario.materno">

    <label>Correo Electrónico:</label>
    <input type="email" name="correo" [(ngModel)]="usuario.correo" >

    <label>Fecha de Registro:</label>
    <input type="date" name="fecha" [(ngModel)]="usuario.fecharegistro" [max]="hoy" readonly>

    <button type="submit" [disabled]="userForm.invalid">Guardar Usuario</button>
  </form>
</div>
